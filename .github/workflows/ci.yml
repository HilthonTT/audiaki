name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build with warnings as errors
        run: make STRICT=1 CC=${{ matrix.cc }}

      - name: Run unit tests
        run: make STRICT=1 CC=${{ matrix.cc }} test

      - name: Smoke test the binary
        run: |
          ./build/audiaki --version
          ./build/audiaki --help
          # a malformed invocation must exit 2 rather than crash or record
          status=0
          ./build/audiaki --rate not-a-number out.wav || status=$?
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2 for a bad --rate, got $status" >&2
            exit 1
          fi
          test ! -e out.wav

  build-all-backends:
    name: build (every Linux backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The job above builds what a bare machine has, which is ALSA alone - so
      # without this one the PipeWire and JACK backends are never compiled by
      # CI at all, and a warning in either reaches a release. Everything is
      # present here on purpose, so every backend this platform can build is
      # built with warnings as errors.
      - name: Install every backend's headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev \
                                  libjack-jackd2-dev

      - name: Build with warnings as errors
        run: make STRICT=1

      - name: Check the backends are all in
        run: |
          make help
          for backend in alsa pipewire jack; do
            ./build/audiaki --help | grep -q "$backend" || {
              echo "the $backend backend was not compiled in" >&2
              exit 1
            }
          done

  build-macos:
    name: build (macOS, CoreAudio)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The only place the CoreAudio backend is compiled, and the only place
      # the build is exercised without ALSA present at all - the two are the
      # same test, because ALSA does not exist here and a Makefile that assumed
      # it would fail at the link rather than at a missing header.
      - name: Build with warnings as errors
        run: make STRICT=1

      - name: Run unit tests
        run: make STRICT=1 test

      - name: Smoke test the binary
        run: |
          ./build/audiaki --version
          ./build/audiaki --help | grep -q coreaudio
          ./build/audiaki --list

  tests-without-alsa:
    name: unit tests (no ALSA installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The sound-server-free layers must keep building on their own; this is
      # what keeps libasound confined to src/backend. `make test` links only
      # PORTABLE_SRCS, which is every layer below src/cli and src/cmd, so a
      # module that starts reaching for a device fails this job rather than
      # quietly making the suite unbuildable for anyone without the headers.
      - name: Run unit tests
        run: make STRICT=1 test

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build and test with sanitizers
        run: |
          make STRICT=1 \
               OPTFLAGS="-O1 -g" \
               SANITIZE="-fsanitize=address,undefined -fno-sanitize-recover=all" \
               all test

  # The other jobs never see src/gui: they do not check out the raylib
  # submodule, so `make` quietly builds the CLI alone. This is what stops the
  # desktop app rotting unnoticed - and it exercises the submodule and the
  # vendored raylib build at the same time.
  desktop:
    name: desktop app (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev \
                                  libxrandr-dev libxi-dev libxcursor-dev \
                                  libxinerama-dev libxkbcommon-dev

      - name: Build the desktop app
        run: make STRICT=1 CC=${{ matrix.cc }} gui

      # --help is handled before the window is opened, so this runs on a
      # headless runner with no display.
      - name: Smoke test the binary
        run: |
          ./build/audiaki-gui --help
          status=0
          ./build/audiaki-gui --nonsense || status=$?
          if [ "$status" -ne 2 ]; then
            echo "expected exit status 2 for a bad option, got $status" >&2
            exit 1
          fi

  fuzz:
    name: fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ALSA headers and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev clang

      # The corpus first, and with whatever compiler is default: an input that
      # crashed once and was fixed is a test from then on, and one that needs a
      # particular compiler to run is a test that stops being run. Seconds.
      - name: Replay the corpus
        run: make STRICT=1 fuzz-replay

      # ...then go looking for new ones. libFuzzer is clang's, which is the only
      # reason this job installs it. Anything found is written into the corpus
      # directory and uploaded below, so it can be added and fixed.
      - name: Fuzz
        run: make fuzz-run FUZZ_CC=clang FUZZ_SECONDS=120

      - name: Keep whatever it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/corpus/
          if-no-files-found: ignore

  style:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: make format-check

  static-analysis:
    name: cppcheck + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install analysers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck shellcheck libasound2-dev

      # src/gui is skipped: it is written against raylib's headers, which this
      # job does not have, and without them cppcheck cannot even parse a
      # CLITERAL(Color){...} colour constant, let alone say anything useful
      # about it. The desktop job below compiles that code with -Werror under
      # both compilers instead.
      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 --std=c11 --quiet \
                   --enable=warning,performance,portability \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   -i src/gui \
                   -I src -I fuzz src tests fuzz

      - name: shellcheck
        run: shellcheck scripts/*.sh
